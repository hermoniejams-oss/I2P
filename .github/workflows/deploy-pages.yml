name: Deploy I2P public website

on:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# The deploy-pages action uses the GitHub Actions API to find the
# github-pages artifact uploaded earlier in this workflow.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify website files
        run: |
          test -f www/index.html
          test -f www/styles.css
          test -f www/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: www
          retention-days: 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
