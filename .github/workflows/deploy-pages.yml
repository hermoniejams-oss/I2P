
name: Deploy I2P public website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify website files
        run: |
          test -f www/index.html
          test -f www/styles.css
          test -f www/app.js
          echo "I2P website files verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: www/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
